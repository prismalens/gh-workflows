name: Claude Code

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    # Admission is effective repository permission checked live in the `admit` step below.
    # `sender` is the account that performed the triggering action on all four event shapes.
    # `author_association` is banned from admission. Stories: prismalens/prismalens#415 and #422.
    if: |
      github.event.sender.type != 'Bot' &&
      !endsWith(github.event.sender.login, '[bot]') && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Admit sender
        id: admit
        uses: prismalens/gh-workflows/.github/actions/admit@main
        with:
          login: ${{ github.event.sender.login }}
          token: ${{ github.token }}

      - name: Checkout repository
        if: steps.admit.outputs.admitted == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 1
          # persist-credentials: false prevents leaving git credentials in workspace.
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        if: steps.admit.outputs.admitted == 'true'
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # Must never submit PR reviews: --disallowed-tools blocks review submission
          # and thread resolution to contain prompt injection. Stories: prismalens/prismalens#415 and #422.
          claude_args: >-
            --disallowed-tools "Bash(gh pr review:*)"
            --disallowed-tools "Bash(gh api:*pulls/*/reviews*)"

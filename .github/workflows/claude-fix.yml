# Fixer lane applies code fixes on PR branches. Thread-resolution powers are deliberately withheld and merges stay human.
# Story: prismalens/prismalens#403.
name: Claude Fix

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  # Resolves PR head ref and gates write-capable checkout on same-repo check to contain fork PRs.
  # Stories: prismalens/prismalens#403 and #422.
  resolve-pr:
    # Restricts resolution to authorized commenters on PR fix mentions. Story: prismalens/prismalens#422.
    if: |
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude fix')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude fix'))
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      same_repo: ${{ steps.pr.outputs.same_repo }}
    steps:
      - name: Fetch PR metadata and validate origin
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr")"

          echo "head_ref=${head_ref}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

          # FORK GUARD — the whole point of this job.
          # If the PR comes from a fork, `same_repo` is 'false' and the
          # `fix` job's `if:` will skip, denying the write credential to
          # code the repo owner did not author.
          if [[ "$head_repo" == "$GITHUB_REPOSITORY" ]]; then
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PR head repo '${head_repo}' does not match '${GITHUB_REPOSITORY}' — refusing to checkout fork code with write credentials."
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
          fi

  # Enforces association filter and 3-layer containment (allowlist, token scope, deny list) for write access.
  # Story: prismalens/prismalens#422.
  fix:
    needs: resolve-pr
    if: |
      needs.resolve-pr.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checks out validated PR head ref for write-capable branch pushing. Story: prismalens/prismalens#422.
          ref: ${{ needs.resolve-pr.outputs.head_ref }}
          fetch-depth: 1
          # persist-credentials: true enables pushing commits back to PR branch. Story: prismalens/prismalens#422.
          persist-credentials: true

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        # Synchronous subagents required in print mode or the fixer exits before subagents report back.
        # Story: prismalens/prismalens#403.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Tool list is load-bearing: scoped to fixer edits; Task, gh pr review/merge, and thread resolution are deliberately absent.
          # Stories: prismalens/prismalens#415 and #422.
          claude_args: >-
            --allowed-tools
            "Read,Grep,Glob,LS,Edit,Write,MultiEdit,TodoWrite,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_comment__update_claude_comment"
            --disallowed-tools "Bash(gh pr review:*)"
            --disallowed-tools "Bash(gh pr merge:*)"

          prompt: |
            You are a code fixer. An org member has commented `@claude fix` on
            this pull request. Your job:

            1. Read the PR diff and ALL unresolved review threads on this PR.
            2. For each unresolved thread that describes a fixable issue, apply
               the fix to the codebase on the PR's existing branch.
            3. Commit your changes with clear, conventional-commit messages.
               Never force-push — always a normal `git push`.
            4. After pushing, update your summary comment (using the
               `mcp__github_comment__update_claude_comment` tool) with a table
               listing each review thread you addressed and the commit SHA that
               fixes it. Format: one row per thread, with the thread's first
               line of context and the short SHA. This lets the reviewer or
               operator cross-reference each thread with its fix.
            5. If a finding requires changes to files under `.github/workflows/`,
               do NOT edit those files. Instead, note in the summary comment
               that the fix requires a workflow change and must be applied by
               the operator.
            6. If you cannot fix a finding, note it in the summary comment
               explaining why.

            Never resolve review threads. Never submit a review. Never merge.
            Never force-push.

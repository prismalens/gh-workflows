# The only self-triggering workflow here: the other three are `workflow_call` callees and
# never run in this repo, so without this nothing verifies them before they reach consumers.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The merge queue waits for every required check on its merge commit (Sumit1993/rig#150).
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install deps
        run: pip install --quiet pyyaml

      # Extracts and runs the real shell body out of claude-code-review.yml.
      - name: Liveness marker behaviour
        run: python3 tests/test-liveness-marker.py

      - name: Incremental review mode behaviour
        run: python3 tests/test-incremental-mode.py

      # Extracts and runs the real script out of claude-code-review.yml. Story: #162.
      - name: Patch fingerprint behaviour
        run: python3 tests/test-patch-fingerprint.py

      # Extracts and runs the real script out of claude-code-review.yml. Story: #33, #34.
      - name: Review config and model escalation behaviour
        run: python3 tests/test-review-config.py

      - name: Thread mutation and summary verification
        run: python3 tests/test-mutation-verdicts.py

      # Extracts and runs the real script out of vendored-prompt-drift.yml. Story: #30.
      - name: Vendored prompt drift check behaviour
        run: python3 tests/test-vendored-prompt-drift.py

      # Extracts and runs the real script out of dependabot-config-drift.yml. Story: #44.
      - name: Dependabot config drift check behaviour
        run: python3 tests/test-dependabot-config-drift.py

      - name: Display report Step Summary behaviour
        run: python3 tests/test-display-report.py

      # Extracts and runs the real script out of deploy-worker.yml.
      - name: Deploy Worker migration check behaviour
        run: python3 tests/test-deploy-worker-migration-check.py

      # Extracts and runs the real scripts out of claude-code-review.yml. Stories: #70, #71, #72, #87.
      - name: Telemetry wave 2 record and lane event behaviour
        run: python3 tests/test-telemetry-record.py

      # Compares migration-defined schema against INSERT/SELECT in worker/index.js. Story: #99.
      - name: Schema-to-code drift check
        run: python3 tests/test-schema-drift.py

      # An unrecognised verdict_kind is bucketed as `error` by the dashboard, so a kind the
      # lane emits and the dashboard has never heard of displays as a failed round. Three
      # had already drifted that way. Story: #149, #153.
      - name: Verdict kind drift check
        run: python3 tests/test-verdict-kind-drift.py

      # A reason the workflow emits that the worker rejects is a silent 400 (telemetry
      # loss); a reason the dashboard has never heard of is a row that can never
      # populate. Both directions drifted once. Story: #154.
      - name: Lane event reason drift check
        run: python3 tests/test-lane-event-reason-drift.py

      # Extracts and runs the real smoke test step out of deploy-worker.yml. Story: #84.
      - name: Deploy Worker post-deploy smoke test behaviour
        run: python3 tests/test-deploy-worker-smoke.py

      # Extracts and runs the forward-only migration guard from this workflow.
      - name: Forward-only migration guard behaviour
        run: python3 tests/test-migration-forward-only.py

      # Extracts and runs the real script out of review-findings-sweep.yml. Story: #47.
      - name: Review findings sweep behaviour
        run: python3 tests/test-review-findings-sweep.py

      # Extracts and runs the real 'Build review manifest' script out of
      # claude-code-review.yml, plus the reviewable_lines size cap. Story: #105.
      - name: Review manifest behaviour
        run: python3 tests/test-review-manifest.py

      # Extracts and runs the real 'Build review context' script out of
      # claude-code-review.yml: profile, issues, ci_failures, dependencies, and
      # tool_findings. Stories: #143, #144, #145, #146, #147.
      - name: Review context behaviour
        run: python3 tests/test-review-context.py

      # Extracts and runs the real 'Check out declared context repositories'
      # script out of claude-code-review.yml against a stubbed gh and git. Story: #90.
      - name: Context checkout behaviour
        run: python3 tests/test-context-checkout.py

      # Extracts and runs the real 'Classify the round's outcome' script out of
      # claude-code-review.yml: the failure_class table and reset_at parsing. Story: #174.
      - name: Round failure classification behaviour
        run: python3 tests/test-round-failure-class.py

      # Both actionlint installs carry one version and one checksum (#163).
      - name: actionlint pin drift
        run: python3 tests/test-actionlint-pin-drift.py

      # The one-click apply verifies against d1_migrations, never wrangler's summary (#164).
      - name: Apply migrations workflow behaviour
        run: python3 tests/test-apply-migrations.py

      # The fleet failure reporter's window, content and gating (#169).
      - name: CI failure report behaviour
        run: python3 tests/test-ci-failure-report.py

      # Seven tests existed and this job never ran them, which is how #166 bumped both
      # uses: pins and left env.ACTION_VERSION on the old SHA with a green check (#130).
      - name: action_version drift
        run: python3 tests/test-action-version-drift.py

      - name: Agent rollup
        run: python3 tests/test-agent-rollup.py

      - name: Path filters
        run: python3 tests/test-path-filters.py

      - name: Pause and resume
        run: python3 tests/test-pause-resume.py

      - name: Prompt hash template
        run: python3 tests/test-prompt-hash-template.py

      - name: Review prompt remedy, precedence and dedup rules
        run: python3 tests/test-review-prompt-remedy.py


      - name: Verify tool allowlist
        run: python3 tests/test-verify-tool-allowlist.py

      - name: Verify round telemetry
        run: python3 tests/test-verify-round-telemetry.py

      # Runs the real setup-repo.sh issue-template sync section against a stub gh (#67).
      - name: setup-repo.sh issue-template sync behaviour
        run: python3 tests/test-setup-repo-templates.py

      # Runs the real rotate-telemetry-token.sh against stub gh, openssl and npx (#156).
      - name: rotate-telemetry-token.sh behaviour
        run: python3 tests/test-rotate-telemetry-token.py

      # Verifies wrangler.toml run_worker_first covers all routes, GET and DELETE as well as POST (#176, #184).
      - name: Worker route coverage in wrangler.toml
        run: python3 tests/test-worker-routes-reach-worker.py

      # Verifies telemetry-auth composite action behaviour (#176).
      - name: Telemetry auth action behaviour
        run: python3 tests/test-telemetry-auth-action.py

      # Verifies telemetry-health workflow behaviour (#176).
      - name: Telemetry health behaviour
        run: python3 tests/test-telemetry-health.py

      # A fleet handler's SQL never names a text column (#185).
      - name: Fleet routes never select text (#185)
        run: python3 tests/test-fleet-wall.py

      # The App webhook counts reviewable lines as the lane's manifest step does (#184).
      - name: Webhook size count matches the lane
        run: python3 tests/test-webhook-size-drift.py

      # The App manifest's permissions are pinned, and the minted token is read-only (#184).
      - name: App manifest permissions (#184)
        run: python3 tests/test-app-manifest.py

      # The text-tier audit prints field names and lengths, never a value (#183).
      - name: Text-tier audit prints no contents (#183)
        run: python3 tests/test-audit-telemetry-text.py

      # Hourly review queue decision logic and snapshot behaviour (#150).
      - name: Review queue behaviour (#150)
        run: python3 tests/test-review-queue.py

      # A test file this job does not name is a test that never runs (#130).
      - name: Every test file is wired into this job
        run: |
          set -euo pipefail
          missing=0
          for t in tests/test-*.py; do
            if ! grep -qF "$(basename "$t")" .github/workflows/tests.yml; then
              echo "::error::${t} exists but nothing in tests.yml runs it (#130)."
              missing=1
            fi
          done
          exit "${missing}"

      # Version pinned: an actionlint release must not turn a green branch red on its own.
      # The release tarball against a recorded checksum, never the upstream installer from
      # a moving branch (#163). tests/test-actionlint-pin-drift.py holds this step and the
      # review callee's copy to one version and one checksum.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' -o "${asset}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${asset}"
          echo "${ACTIONLINT_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" actionlint
          ./actionlint -version
          # Two suppressions, all verified false positives, all re-checkable by deleting the flag:
          # `conclusion` IS claude-code-action@v1's first declared output — actionlint's bundled
          # action schema is stale. SC2016 fires on $owner/$name/$pr inside a single-quoted GraphQL
          # query, where not expanding them is the entire point.
          ./actionlint -color \
            -ignore 'property "conclusion" is not defined' \
            -ignore 'SC2016'

      # A notice, never a failure: an upstream release must not turn a branch red, and a
      # pin nobody is told about is a pin that stays stale (#163).
      - name: Say when the actionlint pin is behind the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: 1.7.12
        run: |
          if ! latest="$(gh api repos/rhysd/actionlint/releases/latest --jq .tag_name)"; then
            echo "::notice::Could not read the latest actionlint release; the pin's staleness is unknown this run (#163)."
            exit 0
          fi
          if [ "${latest#v}" != "${ACTIONLINT_VERSION}" ]; then
            echo "::notice::actionlint is pinned at ${ACTIONLINT_VERSION}; the latest release is ${latest#v}. Bump ACTIONLINT_VERSION and ACTIONLINT_SHA256 in tests.yml and claude-code-review.yml together (#163)."
          fi

  # The dashboard is the only compiled artefact in the repo and dist/ is not committed,
  # so nothing else would catch a build that stopped working. Story: #46.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      # This job runs npm scripts out of the checked-out tree, so the job token
      # must not be left in .git/config for them to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit and route tests
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this typechecks too.
      - name: Typecheck and build
        run: npm run build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Worker tests
        run: npm test

  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Install
        run: npm ci

      # Unit tests only: the contract, the policy and the mapper. The engine itself is
      # covered by runner/scripts/permission-probe.sh, which needs a model. Story: #184.
      - name: Runner tests
        run: npm test

  # ── Local D1 migration check ───────────────────────────────
  #
  # Applies every migration to a fresh local D1 and verifies none
  # are left pending.  No Cloudflare credential is needed: wrangler
  # creates a local sqlite file under .wrangler/state.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Apply all migrations locally
        run: npm run migrate:local

      - name: Verify no migrations are pending
        run: |
          set -euo pipefail
          output="$(npm run migrate:list:local 2>&1)"
          echo "${output}"
          if echo "${output}" | grep -q "Migrations to be applied:"; then
            echo "::error::Migrations are still pending after migrate:local. This means a migration failed to apply."
            exit 1
          fi

  # ── Forward-only migration guard (PR only) ──────────────────
  #
  # Diffs worker/migrations/ against the merge base and fails if any
  # existing file was modified or deleted.  Only additions are allowed.
  # Uses explicit fetch of the base ref rather than relying on shallow
  # checkout depth.
  migration-guard:
    name: Migration guard
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Fetch enough history to compute merge-base against the PR target.
          fetch-depth: 0

      - name: Forward-only migration guard
        run: |
          set -euo pipefail
          base="${GITHUB_BASE_REF:-main}"
          # Explicit fetch: the checkout action fetches all history (depth 0)
          # but the base ref may not be a local branch, so we fetch it by name.
          git fetch origin "${base}" --quiet
          merge_base="$(git merge-base HEAD "origin/${base}")"
          echo "Merge base: ${merge_base}"

          violations=""
          while IFS=$'\t' read -r status file; do
            [ -z "${status}" ] && continue
            case "${file}" in
              worker/migrations/*) ;;
              *) continue ;;
            esac
            if [ "${status}" != "A" ]; then
              echo "::error::${file} was ${status} (only additions are allowed in worker/migrations/)"
              violations="${violations}  ${status} ${file}\n"
            fi
          done < <(git diff --name-status "${merge_base}" HEAD)

          if [ -n "${violations}" ]; then
            printf "Forbidden changes to existing migrations:\n%b" "${violations}"
            echo "::error::Existing migrations must not be modified or deleted. Only new migration files are allowed."
            exit 1
          fi
          echo "Migration guard passed: only additions detected."

# The only self-triggering workflow here: the other three are `workflow_call` callees and
# never run in this repo, so without this nothing verifies them before they reach consumers.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install deps
        run: pip install --quiet pyyaml

      # Extracts and runs the real shell body out of claude-code-review.yml.
      - name: Liveness marker behaviour
        run: python3 tests/test-liveness-marker.py

      - name: Incremental review mode behaviour
        run: python3 tests/test-incremental-mode.py

      # Extracts and runs the real script out of claude-code-review.yml. Story: #33, #34.
      - name: Review config and model escalation behaviour
        run: python3 tests/test-review-config.py

      - name: Thread mutation and summary verification
        run: python3 tests/test-mutation-verdicts.py

      # Extracts and runs the real script out of vendored-prompt-drift.yml. Story: #30.
      - name: Vendored prompt drift check behaviour
        run: python3 tests/test-vendored-prompt-drift.py

      # Extracts and runs the real script out of dependabot-config-drift.yml. Story: #44.
      - name: Dependabot config drift check behaviour
        run: python3 tests/test-dependabot-config-drift.py

      - name: Display report Step Summary behaviour
        run: python3 tests/test-display-report.py

      # Version pinned: an actionlint release must not turn a green branch red on its own.
      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          # Two suppressions, all verified false positives, all re-checkable by deleting the flag:
          # `conclusion` IS claude-code-action@v1's first declared output — actionlint's bundled
          # action schema is stale. SC2016 fires on $owner/$name/$pr inside a single-quoted GraphQL
          # query, where not expanding them is the entire point.
          ./actionlint -color \
            -ignore 'property "conclusion" is not defined' \
            -ignore 'SC2016'

  # The dashboard is the only compiled artefact in the repo and dist/ is not committed,
  # so nothing else would catch a build that stopped working. Story: #46.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      # This job runs npm scripts out of the checked-out tree, so the job token
      # must not be left in .git/config for them to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit and route tests
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this typechecks too.
      - name: Typecheck and build
        run: npm run build

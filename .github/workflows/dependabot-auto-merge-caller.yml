# This is a managed caller stub.
# Logic lives in .github/workflows/dependabot-auto-merge.yml.
# Do not add logic here.

name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

# Keyed on PR number so concurrent events on the same pull request cancel in-flight runs.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    uses: ./.github/workflows/dependabot-auto-merge.yml
    permissions:
      contents: write
      pull-requests: write

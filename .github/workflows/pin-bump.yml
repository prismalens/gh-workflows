# Moves a caller's pin on a coding agent or adapter once a release has soaked, as a PR whose
# body carries the caller's zero-token probe result. Story: #250.
name: Pin bump

on:
  workflow_call:
    inputs:
      package:
        description: 'npm package whose version is pinned'
        type: string
        required: true
      pin-path:
        description: 'JSON file holding the pin, such as package.json'
        type: string
        required: true
      pin-key:
        description: 'JSON array path to the pin, such as ["engines","codex"]; empty searches the dependency maps for the package'
        type: string
        required: false
        default: ''
      soak-days:
        description: 'Days a release must have been public before the pin moves to it'
        type: number
        required: false
        default: 7
      probe:
        description: 'Command run after the pin moves (PIN_VERSION is set), such as an ACP initialize + session/new with no model'
        type: string
        required: true
    secrets:
      token:
        description: 'A token whose PRs start CI; github.token opens a PR that runs no checks'
        required: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # The caller grants both; a callee can only narrow its caller's token (AGENTS.md).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.token || github.token }}

      - name: Pick the newest soaked release
        id: pick
        env:
          PACKAGE: ${{ inputs.package }}
          PIN_PATH: ${{ inputs.pin-path }}
          PIN_KEY: ${{ inputs.pin-key }}
          SOAK_DAYS: ${{ inputs.soak-days }}
        run: |
          set -euo pipefail
          npm view "$PACKAGE" time --json > "$RUNNER_TEMP/times.json"
          node - <<'JS'
          const fs = require('fs');
          const { PACKAGE, PIN_PATH, PIN_KEY, SOAK_DAYS, RUNNER_TEMP, GITHUB_OUTPUT } = process.env;
          const out = (k, v) => fs.appendFileSync(GITHUB_OUTPUT, `${k}=${v}\n`);
          const times = JSON.parse(fs.readFileSync(`${RUNNER_TEMP}/times.json`, 'utf8'));
          const pins = JSON.parse(fs.readFileSync(PIN_PATH, 'utf8'));
          // A key is a JSON array path, since package names may hold dots.
          const maps = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies'];
          const at = (path) => path.reduce((o, p) => (o == null ? undefined : o[p]), pins);
          const key = PIN_KEY ? JSON.parse(PIN_KEY) : maps.map((m) => [m, PACKAGE]).find((k) => at(k) !== undefined);
          const pin = key && at(key);
          if (typeof pin !== 'string') throw new Error(`no pin for ${PACKAGE} in ${PIN_PATH}${PIN_KEY ? ` at ${PIN_KEY}` : ''}`);
          const m = /^([~^=]?)(\d+\.\d+\.\d+\S*)$/.exec(pin);
          if (!m) throw new Error(`pin ${pin} is not a version`);
          const [, prefix, current] = m;
          const cutoff = Date.now() - Number(SOAK_DAYS) * 86400e3;
          const candidate = Object.entries(times)
            .filter(([v, t]) => /^\d+\.\d+\.\d+$/.test(v) && Date.parse(t) <= cutoff)
            .sort((a, b) => Date.parse(b[1]) - Date.parse(a[1]))[0];
          out('key', JSON.stringify(key)); out('current', current); out('prefix', prefix);
          if (!candidate || !times[current] || Date.parse(candidate[1]) <= Date.parse(times[current])) {
            console.log(`${PACKAGE} stays at ${current}: no newer release soaked ${SOAK_DAYS} days`);
            out('version', '');
          } else {
            console.log(`${PACKAGE}: ${current} -> ${candidate[0]} (published ${candidate[1]})`);
            out('version', candidate[0]); out('published', candidate[1]);
          }
          JS

      - name: Move the pin and probe it
        id: probe
        if: steps.pick.outputs.version != ''
        env:
          PACKAGE: ${{ inputs.package }}
          PIN_PATH: ${{ inputs.pin-path }}
          PIN_KEY: ${{ steps.pick.outputs.key }}
          PIN_VERSION: ${{ steps.pick.outputs.version }}
          PREFIX: ${{ steps.pick.outputs.prefix }}
          PROBE: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          pkg="${PACKAGE#@}"
          branch="pin-bump/${pkg//\//-}-${PIN_VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; its PR carries this bump"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const fs = require("fs"); const { PIN_PATH, PIN_KEY, PIN_VERSION, PREFIX } = process.env;
            const raw = fs.readFileSync(PIN_PATH, "utf8"); const j = JSON.parse(raw);
            const indent = /^\{\r?\n([ \t]+)/.exec(raw)?.[1] ?? 2;
            const path = JSON.parse(PIN_KEY); const leaf = path.pop();
            path.reduce((o, p) => o[p], j)[leaf] = PREFIX + PIN_VERSION;
            fs.writeFileSync(PIN_PATH, JSON.stringify(j, null, indent) + "\n");'
          set +e
          bash -c "$PROBE" 2>&1 | tee "$RUNNER_TEMP/probe.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.pick.outputs.version != '' && steps.probe.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          PACKAGE: ${{ inputs.package }}
          PIN_PATH: ${{ inputs.pin-path }}
          CURRENT: ${{ steps.pick.outputs.current }}
          PIN_VERSION: ${{ steps.pick.outputs.version }}
          PUBLISHED: ${{ steps.pick.outputs.published }}
          SOAK_DAYS: ${{ inputs.soak-days }}
          BRANCH: ${{ steps.probe.outputs.branch }}
          STATUS: ${{ steps.probe.outputs.status }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -am "build(deps): pin ${PACKAGE} ${PIN_VERSION}"
          git push origin "$BRANCH"
          result=$([ "$STATUS" = "0" ] && echo "passed" || echo "failed (exit $STATUS)")
          {
            echo "Moves \`${PACKAGE}\` in \`${PIN_PATH}\` from ${CURRENT} to ${PIN_VERSION}, published ${PUBLISHED} (soaked ${SOAK_DAYS} days)."
            echo
            echo "Zero-token probe: **${result}**."
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/probe.log"
            echo '```'
            echo
            echo "- [ ] Recorded on the operator's machine against a real model and the fixtures updated (prismalens/gh-workflows docs/acp-recording.md)"
          } > "$RUNNER_TEMP/body.md"
          gh pr create --head "$BRANCH" --title "build(deps): pin ${PACKAGE} ${PIN_VERSION}" --body-file "$RUNNER_TEMP/body.md"
          [ "$STATUS" = "0" ] || { echo "::error::the probe failed on ${PACKAGE}@${PIN_VERSION}"; exit 1; }

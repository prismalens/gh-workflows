name: Bug report
description: Something in gh-workflows' reusable workflows, the review lane, or the telemetry Worker behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do **not** paste real
        secrets, tokens, API keys, or connection strings. Issues are public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: A workflow run, the review lane, or the telemetry Worker did ... and I expected ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact actions or commands, in order. Name the workflow, the trigger, and the run.
      placeholder: |
        1. ...
        2. ...
        3. see error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The release, or the git commit SHA of gh-workflows you are consuming.
      placeholder: commit abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The consumer repo, runner OS, and how the workflow is invoked (reusable workflow call, direct dispatch, etc.).
      placeholder: prismalens/prismalens, ubuntu-latest runner, reusable workflow call
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Workflow run logs, error messages, or telemetry output. Redact anything sensitive first.
      render: shell
    validations:
      required: false
  - type: textarea
    id: docs-impact
    attributes:
      label: Docs impact (optional)
      description: If fixing this also requires a docs correction, note which surface.
    validations:
      required: false
  - type: textarea
    id: dashboard-surface
    attributes:
      label: Which dashboard surface this change affects
      description: >
        Name the dashboard surface this change affects. Describe what has to
        change there. "none, because ..." is a valid answer as long as the
        because is filled in. The point is a named answer, not a surface that
        must exist.
      placeholder: "none, because this change does not affect any dashboard surface"
    validations:
      required: true

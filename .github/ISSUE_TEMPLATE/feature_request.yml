name: Feature request
description: Suggest an idea or improvement for gh-workflows' reusable workflows, review lane, or telemetry Worker.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: When wiring up CI or the review lane for a consumer repo I ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like gh-workflows to do. Sketches and example workflow YAML welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or tools you have tried or thought about.
    validations:
      required: false
  - type: textarea
    id: docs-impact
    attributes:
      label: Docs impact
      description: Which doc surfaces will this touch (AGENTS.md, a consumer repo's registry entry, skill docs)? "none" must be justified.
    validations:
      required: true
  - type: textarea
    id: dashboard-surface
    attributes:
      label: Which dashboard surface this change affects
      description: >
        Name the dashboard surface this change affects. Describe what has to
        change there. "none, because ..." is a valid answer as long as the
        because is filled in. The point is a named answer, not a surface that
        must exist.
      placeholder: "none, because this change does not affect any dashboard surface"
    validations:
      required: true

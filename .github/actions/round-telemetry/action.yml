name: Round telemetry
description: >-
  Builds a telemetry record from a completed claude-code-action round's execution
  file. No network calls: the record is posted later, by the `telemetry` job,
  which alone holds `id-token: write`. Shared by the review job and the verify
  job so a verify round writes telemetry too (#87 cause 2, #176).

inputs:
  execution_file:
    description: Path to the claude-code-action execution file for this round
    required: true
  agents:
    description: JSON array of per-agent rollup records
    required: false
    default: ''
  agents_status:
    description: Rollup status ('ok', 'parse-failed', 'script-failed', etc.)
    required: false
    default: ''
  repo:
    description: github.repository
    required: true
  pr_number:
    description: Pull request number
    required: false
    default: ''
  server_url:
    description: github.server_url
    required: true
  run_id:
    description: github.run_id
    required: true
  run_attempt:
    description: github.run_attempt
    required: true
  round_type:
    description: "'review', 'incremental' or 'verify'"
    required: true
  model:
    description: Model used for this round
    required: false
    default: ''
  resolve_changed_files:
    description: needs.resolve.outputs.changed_files
    required: false
    default: ''
  resolve_diff_lines:
    description: needs.resolve.outputs.diff_lines
    required: false
    default: ''
  base_pr_number:
    description: needs.resolve.outputs.base_pr_number
    required: false
    default: ''
  resolve_patch_fingerprint:
    description: needs.resolve.outputs.patch_fingerprint
    required: false
    default: ''
  claude_outcome:
    description: outcome of the claude-code-action step for this round
    required: false
    default: ''
  head_sha:
    description: needs.resolve.outputs.head_sha
    required: false
    default: ''
  prompt_hash:
    description: Hash of the prompt built for this round, when one was built
    required: false
    default: ''
  action_version:
    description: Pinned claude-code-action SHA (env.ACTION_VERSION)
    required: false
    default: ''
  config_hash:
    description: Resolved review config hash
    required: false
    default: ''
  variant:
    description: Resolved review config variant
    required: false
    default: ''
  level:
    description: Effective escalation level for this round
    required: false
    default: ''
  level_source:
    description: Why that level was chosen
    required: false
    default: ''
  reviewable_lines:
    description: Lines the manifest admitted for review
    required: false
    default: ''
  size_override:
    description: Whether an operator override lifted the size cap
    required: false
    default: ''
  failure_class:
    description: Account/auth/quota failure classification, when classified
    required: false
    default: ''
  failure_retryable:
    description: Whether that failure class is retryable
    required: false
    default: ''
  failure_reset_at:
    description: Parsed reset time for that failure class, when known
    required: false
    default: ''
  api_error_status:
    description: HTTP status the API returned on failure, when known
    required: false
    default: ''
  credential_type:
    description: "Which credential authenticated this round: 'oauth' or 'api_key'"
    required: false
    default: ''
  context_repositories:
    description: Count of extra repositories checked out for context
    required: false
    default: ''
  context_lines_telemetry:
    description: Total lines read from those extra repositories
    required: false
    default: ''

outputs:
  record:
    description: The telemetry record JSON, empty when this round produced none
    value: ${{ steps.telemetry.outputs.record }}
  num_turns:
    description: num_turns from the record, on its own for the announce job
    value: ${{ steps.telemetry.outputs.num_turns }}

runs:
  using: composite
  steps:
    # Reads result.modelUsage, never result.usage: usage counts only the main thread and
    # undercounts cache reads 9.55x, because a round runs six or more subagents (#45).
    - name: Extract round telemetry
      id: telemetry
      shell: bash
      env:
        EXECUTION_FILE: ${{ inputs.execution_file }}
        AGENTS: ${{ inputs.agents }}
        AGENTS_STATUS: ${{ inputs.agents_status }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr_number }}
        SERVER_URL: ${{ inputs.server_url }}
        RUN_ID: ${{ inputs.run_id }}
        RUN_ATTEMPT: ${{ inputs.run_attempt }}
        ROUND_TYPE: ${{ inputs.round_type }}
        MODEL: ${{ inputs.model }}
        RESOLVE_CHANGED_FILES: ${{ inputs.resolve_changed_files }}
        RESOLVE_DIFF_LINES: ${{ inputs.resolve_diff_lines }}
        BASE_PR_NUMBER: ${{ inputs.base_pr_number }}
        RESOLVE_PATCH_FINGERPRINT: ${{ inputs.resolve_patch_fingerprint }}
        CLAUDE_OUTCOME: ${{ inputs.claude_outcome }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PROMPT_HASH: ${{ inputs.prompt_hash }}
        ACTION_VERSION: ${{ inputs.action_version }}
        CONFIG_HASH: ${{ inputs.config_hash }}
        VARIANT: ${{ inputs.variant }}
        LEVEL: ${{ inputs.level }}
        LEVEL_SOURCE: ${{ inputs.level_source }}
        REVIEWABLE_LINES: ${{ inputs.reviewable_lines }}
        SIZE_OVERRIDE: ${{ inputs.size_override }}
        FAILURE_CLASS: ${{ inputs.failure_class }}
        FAILURE_RETRYABLE: ${{ inputs.failure_retryable }}
        FAILURE_RESET_AT: ${{ inputs.failure_reset_at }}
        API_ERROR_STATUS: ${{ inputs.api_error_status }}
        CREDENTIAL_TYPE: ${{ inputs.credential_type }}
        CONTEXT_REPOSITORIES: ${{ inputs.context_repositories }}
        CONTEXT_LINES_TELEMETRY: ${{ inputs.context_lines_telemetry }}
      run: |
        set -uo pipefail

        if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
          if [ "${CLAUDE_OUTCOME:-skipped}" = "skipped" ]; then
            echo "telemetry: no review ran in this round; nothing to record."
          else
            echo "::warning::telemetry: execution file is missing (path: '${EXECUTION_FILE:-}'); this round will not be recorded."
          fi
          exit 0
        fi
        if ! jq empty "$EXECUTION_FILE" 2>/dev/null; then
          echo "::warning::telemetry: execution file does not parse as JSON; this round will not be recorded."
          exit 0
        fi

        result=$(jq -c '[.[] | select(.type == "result")] | last // empty' "$EXECUTION_FILE" 2>/dev/null || true)
        if [ -z "$result" ]; then
          echo "::warning::telemetry: no result object in the execution file; this round will not be recorded."
          exit 0
        fi

        if [ "$(printf '%s' "$result" | jq -r 'has("modelUsage")' 2>/dev/null || echo false)" != "true" ]; then
          echo "::warning::telemetry: the result object carries no modelUsage; token counts will record as zero. The pinned action may have renamed the field."
        fi

        changed_files="${RESOLVE_CHANGED_FILES:-}"
        diff_lines="${RESOLVE_DIFF_LINES:-}"
        changed_files_raw="${RESOLVE_CHANGED_FILES:-}"
        diff_lines_raw="${RESOLVE_DIFF_LINES:-}"
        if [ -f /tmp/incremental-range.json ]; then
          range_files=$(jq -r '.files | length' /tmp/incremental-range.json 2>/dev/null || true)
          range_lines=$(jq -r '[.files[]? | (.additions // 0) + (.deletions // 0)] | add // 0' /tmp/incremental-range.json 2>/dev/null || true)
          if [ -n "${range_files:-}" ] && [ "$range_files" != "null" ]; then
            changed_files="$range_files"
            changed_files_raw="$range_files"
          fi
          if [ -n "${range_lines:-}" ] && [ "$range_lines" != "null" ]; then
            diff_lines="$range_lines"
            diff_lines_raw="$range_lines"
          fi
        fi
        if [ -f /tmp/claude-path-filters-result.json ]; then
          pf_cf=$(jq -r '.changed_files // empty' /tmp/claude-path-filters-result.json 2>/dev/null || true)
          pf_dl=$(jq -r '.diff_lines // empty' /tmp/claude-path-filters-result.json 2>/dev/null || true)
          pf_cfr=$(jq -r '.changed_files_raw // empty' /tmp/claude-path-filters-result.json 2>/dev/null || true)
          pf_dlr=$(jq -r '.diff_lines_raw // empty' /tmp/claude-path-filters-result.json 2>/dev/null || true)
          if [ -n "$pf_cf" ]; then changed_files="$pf_cf"; fi
          if [ -n "$pf_dl" ]; then diff_lines="$pf_dl"; fi
          if [ -n "$pf_cfr" ]; then changed_files_raw="$pf_cfr"; fi
          if [ -n "$pf_dlr" ]; then diff_lines_raw="$pf_dlr"; fi
        fi

        # The store never takes model-authored or attacker-influencable text, so .result
        # is dropped and denials keep only tool names and counts, never tool_input (#41).
        record=$(printf '%s' "$result" | jq -c \
          --arg repo "$REPO" \
          --arg pr "${PR_NUMBER:-}" \
          --arg server "$SERVER_URL" \
          --arg run_id "$RUN_ID" \
          --arg run_attempt "$RUN_ATTEMPT" \
          --arg round_type "${ROUND_TYPE:-}" \
          --arg model "${MODEL:-}" \
          --arg head_sha "${HEAD_SHA:-}" \
          --arg changed_files "${changed_files:-}" \
          --arg diff_lines "${diff_lines:-}" \
          --arg changed_files_raw "${changed_files_raw:-}" \
          --arg diff_lines_raw "${diff_lines_raw:-}" \
          --arg prompt_hash "${PROMPT_HASH:-}" \
          --arg action_version "${ACTION_VERSION:-}" \
          --arg config_hash "${CONFIG_HASH:-}" \
          --arg variant "${VARIANT:-}" \
          --arg level "${LEVEL:-}" \
          --arg level_source "${LEVEL_SOURCE:-}" \
          --arg reviewable_lines "${REVIEWABLE_LINES:-}" \
          --arg size_override "${SIZE_OVERRIDE:-}" \
          --arg agents "${AGENTS:-[]}" \
          --arg agents_status "${AGENTS_STATUS:-}" \
          --arg failure_class "${FAILURE_CLASS:-}" \
          --arg failure_retryable "${FAILURE_RETRYABLE:-}" \
          --arg failure_reset_at "${FAILURE_RESET_AT:-}" \
          --arg api_error_status "${API_ERROR_STATUS:-}" \
          --arg credential_type "${CREDENTIAL_TYPE:-}" \
          --arg base_pr_number "${BASE_PR_NUMBER:-}" \
          --arg round_patch_fingerprint "${RESOLVE_PATCH_FINGERPRINT:-}" \
          --arg context_repositories "${CONTEXT_REPOSITORIES:-}" \
          --arg context_lines "${CONTEXT_LINES_TELEMETRY:-}" \
          '
          def num(s): if s == "" then null else (s | tonumber? // null) end;
          def denials:
            (.permission_denials
             | if type == "array" then length
               elif type == "number" then .
               else 0 end);
          def denial_tools:
            [ .permission_denials[]?
              | (.tool_name? // "unknown")
              | if type == "string" and test("^[A-Za-z0-9_]{1,64}$") then . else "other" end ]
            | group_by(.) | map({tool: .[0], count: length});
          def safe_strings:
            {type, subtype, session_id, uuid, stop_reason, terminal_reason,
             api_error_status, fast_mode_state}
            | with_entries(select(.value != null));
          {
            session_id: .session_id,
            recorded_at: (now | todateiso8601),
            repository: $repo,
            pr_number: num($pr),
            pr_url: (if $pr == "" then null else "\($server)/\($repo)/pull/\($pr)" end),
            head_sha: (if $head_sha == "" then null else $head_sha end),
            run_id: num($run_id),
            run_attempt: num($run_attempt),
            run_url: "\($server)/\($repo)/actions/runs/\($run_id)",
            round_type: (if $round_type == "" then null else $round_type end),
            model: (if $model == "" then null else $model end),
            input_tokens: ([.modelUsage[]? | .inputTokens // 0] | add // 0),
            output_tokens: ([.modelUsage[]? | .outputTokens // 0] | add // 0),
            cache_read_input_tokens: ([.modelUsage[]? | .cacheReadInputTokens // 0] | add // 0),
            cache_creation_input_tokens: ([.modelUsage[]? | .cacheCreationInputTokens // 0] | add // 0),
            total_cost_usd: .total_cost_usd,
            duration_ms: .duration_ms,
            duration_api_ms: .duration_api_ms,
            num_turns: .num_turns,
            permission_denials: denials,
            changed_files: num($changed_files),
            diff_lines: num($diff_lines),
            changed_files_raw: num($changed_files_raw),
            diff_lines_raw: num($diff_lines_raw),
            prompt_hash: (if $prompt_hash == "" then null else $prompt_hash end),
            action_version: (if $action_version == "" then null else $action_version end),
            config_hash: (if $config_hash == "" then null else $config_hash end),
            variant: (if $variant == "" then null else $variant end),
            level: (if $level == "" then null else $level end),
            level_source: (if $level_source == "" then null else $level_source end),
            reviewable_lines: num($reviewable_lines),
            size_override: (if $size_override == "true" then 1 elif $size_override == "false" then 0 else null end),
            per_model_usage: ((.modelUsage // {}) | tojson),
            subagent_stats: (if .subagent_stats == null then null else (.subagent_stats | tojson) end),
            agents: (if $agents == "" or $agents == "null" then [] else (try ($agents | fromjson) catch []) end),
            agents_status: (if $agents_status == "" then null else $agents_status end),
            failure_class: (if $failure_class == "" then null else $failure_class end),
            failure_retryable: (if $failure_retryable == "" then null else ($failure_retryable | tonumber?) end),
            failure_reset_at: (if $failure_reset_at == "" then null else $failure_reset_at end),
            api_error_status: (if $api_error_status == "" then null else ($api_error_status | tonumber?) end),
            credential_type: (if $credential_type == "" then null else $credential_type end),
            base_pr_number: (if $base_pr_number == "" then null else ($base_pr_number | tonumber?) end),
            patch_fingerprint: (if $round_patch_fingerprint == "" then null else $round_patch_fingerprint end),
            context_repositories: (if $context_repositories == "" then null else ($context_repositories | tonumber?) end),
            context_lines: (if $context_lines == "" then null else ($context_lines | tonumber?) end),
            raw_result: (
              . as $o
              | ($o | del(.result, .permission_denials)) as $base
              | ($base | walk(if type == "string" then null else . end))
                * ($base | safe_strings)
                + {denial_tools: ($o | denial_tools)}
              | tojson)
          }' 2>/dev/null || true)

        if [ -z "$record" ]; then
          echo "::warning::telemetry: could not build the record from the result object; this round will not be recorded."
          exit 0
        fi

        session_id=$(printf '%s' "$record" | jq -r '.session_id // empty')
        if [ -z "$session_id" ] || [ "$session_id" = "null" ]; then
          echo "::warning::telemetry: result object carries no session_id; this round will not be recorded."
          exit 0
        fi

        {
          echo "record<<TELEMETRY_EOF"
          printf '%s\n' "$record"
          echo "TELEMETRY_EOF"
          # A plain output beside the record blob: the announce job wants num_turns
          # on its own to decide `partial` without parsing the whole record (#174).
          echo "num_turns=$(printf '%s' "$record" | jq -r '.num_turns // 0')"
        } >> "$GITHUB_OUTPUT"

        echo "Extracted telemetry for session $session_id: $(printf '%s' "$record" | jq -r '"\(.num_turns) turns, \(.permission_denials) denials, \(.duration_ms)ms"')"

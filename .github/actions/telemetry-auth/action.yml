name: Telemetry Auth
description: >-
  Mints a GitHub Actions OIDC token for review telemetry ingest with fallback to
  bearer token, and resolves the repository's telemetry.share setting. (#176)

inputs:
  url:
    description: Target telemetry Worker URL
    required: false
    default: 'https://review-telemetry.sfun.cloud'
  bearer:
    description: Optional fallback bearer token
    required: false
    default: ''
  share:
    description: Optional telemetry.share override ('full' | 'off')
    required: false
    default: ''
  token:
    description: GitHub token for API queries (defaults to github.token)
    required: false
    default: ${{ github.token }}

outputs:
  authorization:
    description: 'Authorization header value (Bearer <token> or empty)'
    value: ${{ steps.auth.outputs.authorization }}
  method:
    description: "Authentication method used: 'oidc', 'bearer', or 'none'"
    value: ${{ steps.auth.outputs.method }}
  share:
    description: "Telemetry share consent: 'full' or 'off'"
    value: ${{ steps.auth.outputs.share }}

runs:
  using: composite
  steps:
    - name: Resolve telemetry auth and share
      id: auth
      shell: bash
      env:
        TARGET_URL: ${{ inputs.url }}
        BEARER_TOKEN: ${{ inputs.bearer }}
        SHARE_OVERRIDE: ${{ inputs.share }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        RUNNER_TEMP="${RUNNER_TEMP:-/tmp}"
        AUTH_HEADER=""
        METHOD="none"

        # ── 1. Authenticate via GitHub Actions OIDC or Fallback to Bearer ─────────
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          URL="${TARGET_URL:-https://review-telemetry.sfun.cloud}"
          AUDIENCE="$(python3 -c "import sys; from urllib.parse import urlparse; u = urlparse(sys.argv[1]); print(f'{u.scheme}://{u.netloc}')" "$URL" 2>/dev/null || echo "$URL")"

          OIDC_TOKEN=""
          err_file="$RUNNER_TEMP/oidc_mint_err.$$"
          if RESP="$(curl -sS -m 10 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" 2>"$err_file")"; then
            OIDC_TOKEN="$(echo "$RESP" | jq -r '.value // empty' 2>/dev/null || true)"
          fi
          rm -f "$err_file"

          if [ -n "$OIDC_TOKEN" ]; then
            echo "::add-mask::${OIDC_TOKEN}"
            AUTH_HEADER="Bearer ${OIDC_TOKEN}"
            METHOD="oidc"
          else
            echo "::warning::Could not mint GitHub Actions OIDC token; falling back to bearer (#176)"
          fi
        fi

        if [ "$METHOD" = "none" ]; then
          if [ -n "${BEARER_TOKEN:-}" ]; then
            echo "::add-mask::${BEARER_TOKEN}"
            AUTH_HEADER="Bearer ${BEARER_TOKEN}"
            METHOD="bearer"
          else
            AUTH_HEADER=""
            METHOD="none"
          fi
        fi

        # ── 2. Resolve telemetry.share ───────────────────────────────────────────
        RESOLVED_SHARE="${SHARE_OVERRIDE:-}"
        if [ -z "$RESOLVED_SHARE" ]; then
          RESOLVED_SHARE="$(python3 -c "import textwrap; exec(textwrap.dedent(r'''\
          import base64, os, re, subprocess, sys

          def parse_yaml_share(text):
              try:
                  import yaml
                  data = yaml.safe_load(text)
                  if isinstance(data, dict):
                      tel = data.get('telemetry')
                      if isinstance(tel, dict):
                          s = tel.get('share')
                          if s in ('full', 'off'):
                              return s
              except Exception:
                  pass
              m = re.search(r'(?:^|\n)telemetry\s*:\s*(?:[^\n]*\n|\s*\{)[^}\n]*share\s*:\s*[\x22\x27]?(full|off)[\x22\x27]?', text)
              if m:
                  return m.group(1)
              return None

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          res = None

          for local_name in ('.github/claude-review.yml', '.github/claude-review.yaml'):
              if os.path.exists(local_name):
                  try:
                      with open(local_name, 'r', encoding='utf-8') as f:
                          res = parse_yaml_share(f.read())
                          if res:
                              break
                  except Exception:
                      pass

          if not res and repo:
              try:
                  cmd = ['gh', 'api', f'repos/{repo}/contents/.github/claude-review.yml', '--jq', '.content']
                  p = subprocess.run(cmd, capture_output=True, text=True)
                  if p.returncode == 0 and p.stdout.strip():
                      content = base64.b64decode(p.stdout.strip()).decode('utf-8', errors='replace')
                      res = parse_yaml_share(content)
              except Exception:
                  pass

          if not res and '/' in repo:
              owner = repo.split('/')[0]
              try:
                  cmd = ['gh', 'api', f'repos/{owner}/.github/contents/.github/claude-review-defaults.yml', '--jq', '.content']
                  p = subprocess.run(cmd, capture_output=True, text=True)
                  if p.returncode == 0 and p.stdout.strip():
                      content = base64.b64decode(p.stdout.strip()).decode('utf-8', errors='replace')
                      res = parse_yaml_share(content)
              except Exception:
                  pass

          print(res if res in ('full', 'off') else 'full')
          '''))")"
        fi

        if [ "$RESOLVED_SHARE" != "off" ]; then
          RESOLVED_SHARE="full"
        fi

        # ── 3. Write outputs ─────────────────────────────────────────────────────
        echo "authorization=${AUTH_HEADER}" >> "$GITHUB_OUTPUT"
        echo "method=${METHOD}" >> "$GITHUB_OUTPUT"
        echo "share=${RESOLVED_SHARE}" >> "$GITHUB_OUTPUT"

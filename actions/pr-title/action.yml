name: 'Lint PR title'
description: 'Enforce Conventional Commits PR title rules'

inputs:
  types:
    description: 'Allowed commit types (newline-separated string)'
    required: false
    default: |
      feat
      fix
      docs
      style
      refactor
      perf
      test
      build
      ci
      chore
      revert
  github_token:
    description: 'GitHub Token to use for API requests'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - if: github.event_name != 'merge_group'
      uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      with:
        types: ${{ inputs.types }}
    - if: github.event_name == 'merge_group'
      run: echo "Title validated on the pull request before it entered the merge queue."
      shell: bash

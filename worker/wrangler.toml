name = "review-telemetry"
main = "index.js"
compatibility_date = "2026-08-30"

# The zone gives us rate limiting rules, which are zone-scoped and therefore
# unavailable on workers.dev. Story: #60.
routes = [
  { pattern = "assayer.sfun.cloud", custom_domain = true }
]

# The dashboard SPA. dist/ is gitignored, so a deploy must run
# `npm --prefix dashboard ci && npm --prefix dashboard run build` first.
# run_worker_first lists "/" because assets otherwise answer POST / with 405 and the
# ingest alias dies silently; "/" matches the root only. Story: #46.
[assets]
directory = "../dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/ingest", "/api", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "review-telemetry"
database_id = "1e2a6dfd-9d77-4fac-aa21-d55652c164e1"

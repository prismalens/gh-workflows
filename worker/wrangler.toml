name = "review-telemetry"
main = "index.js"
compatibility_date = "2026-08-30"

# The zone gives us rate limiting rules, which are zone-scoped and therefore
# unavailable on workers.dev. Story: #60.
routes = [
  { pattern = "assayer.sfun.cloud", custom_domain = true }
]

# The dashboard SPA. dist/ is gitignored, so a deploy must run
# `npm --prefix dashboard ci && npm --prefix dashboard run build` first.
# run_worker_first lists "/" because assets otherwise answer POST / with 405 and the
# ingest alias dies silently; "/" matches the root only. Story: #46.
[assets]
directory = "../dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/ingest", "/ingest/*", "/pr-state", "/api", "/api/*", "/runner", "/runner/*", "/webhook/github"]

[[d1_databases]]
binding = "DB"
database_name = "review-telemetry"
database_id = "1e2a6dfd-9d77-4fac-aa21-d55652c164e1"
migrations_dir = "migrations"

# Second line of defense behind the zone WAF rate limit rule: bounds ingest load
# and token-guessing per IP from inside the Worker. Story: #60.
[[ratelimits]]
name = "INGEST_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
# Daily retention purge (#183), off the hour.
crons = ["23 4 * * *"]

[vars]
TEXT_RETENTION_DAYS = "30"
# The GitHub App webhook admits pull requests from these repositories only, into jobs
# for this engine and credential kind (#184 bullet 4).
WEBHOOK_REPOSITORIES = "prismalens/sreforge"
WEBHOOK_JOB_ENGINE = "opencode"
WEBHOOK_JOB_CREDENTIAL_KIND = "keyless"
OIDC_ALLOWED_REPOSITORY_IDS = "1124040129,1191857183,1331752084,1256451611"


# gh-workflows is the one repo the Claude review lane cannot review: it hosts the
# callee, and claude-code-action self-skips on any PR editing claude-code-review.yml.
# So auto_review stays ON here, unlike the consumer repos where the Claude lane
# covers every PR and CodeRabbit is the escalation. Story: gh-workflows#14.
language: en-US
reviews:
  profile: chill
  auto_review:
    enabled: true
    auto_pause_after_reviewed_commits: 1
    ignore_title_keywords:
      - "WIP"
    ignore_usernames:
      - "dependabot[bot]"
  path_instructions:
    - path: ".github/workflows/**"
      instructions: >-
        These are reusable workflow callees consumed by prismalens/prismalens,
        prismalens/sreforge and Sumit1993/mage-memory, pinned at @main, so a merge reaches
        all three immediately. Enforce the stub rules in README.md: concurrency is declared
        in the caller only, since a callee sharing the caller's group deadlocks the run;
        `secrets: inherit` does not cross repository owners and must be mapped explicitly;
        every `pull_request` trigger pins `branches`; a stub taking comment triggers falls
        back to `github.event.issue.number` in its concurrency key, or the group collapses
        to a constant and one PR's summon cancels another's run.
        The `review` job is read-only by invariant and its token must never gain write
        permissions, because it reads attacker-influenceable diff text. Flag any change
        that adds a write scope to it.
        A prompt that names a filesystem path the agent cannot read, or that invites a
        chained Bash command, is a silent failure: Bash permissions are matched per
        subcommand and agent mode resolves tools only from `--allowed-tools`. Flag both.
    - path: ".github/workflows/claude-code-review.yml"
      instructions: >-
        This lane's failure mode of record is producing no review while reporting success.
        Flag any change that lets a step conclude successfully without evidence that
        something was posted, and any warning or comment text that asserts an outcome the
        code cannot know at that point.
    - path: ".github/workflows/review-findings-sweep.yml"
      instructions: >-
        This sweep reads GitHub's GraphQL API over pull requests it does not own. Every
        connection it selects is paginated: a `first: N` selection with no `pageInfo`/
        `endCursor` loop truncates at N silently and the sweep still reports success, which is
        the three-outcome collapse this repository keeps hitting. Flag any new selection
        without a cursor loop, and any code path that can drop rows without recording that it
        did. `fix_sha` may only come from a source verified against a real commit oid; flag
        any inference from prose, from a comment body, or from proximity.
    - path: "worker/**"
      instructions: >-
        `tests/test-schema-drift.py` requires every column to be read or explicitly
        allowlisted, so a column added and never read fails the build on purpose; do not
        suggest silencing it. Blob columns are returned only under `include=blobs`, because
        returning one unconditionally changes the size of every list response. Migrations are
        forward-only and `deploy-worker.yml` has no `workflow_dispatch`, so the schema ships on
        merge and cannot be applied by hand first: flag a migration whose correctness depends
        on a backfill, since old rows never gain a value. Ingest authenticates with one shared
        bearer token whose Cloudflare copy is write-only and cannot be read back, so a partial
        repair is impossible and every change to it is a full rotation across five locations.
        Round payloads are lane-authored, but anything the findings sweep stores was written by
        people on a pull request: flag any place that treats swept thread text, comment bodies
        or logins as trusted.
    - path: "dashboard/**"
      instructions: >-
        The one rule this surface exists to hold: a number or label on screen must be backed by
        a column that exists. A field a round does not carry is named as not recorded, naming
        the field, never "unavailable", never inferred from posted text, never defaulted to
        zero or to an empty state that reads as a clean result. Flag any fallback that makes an
        unknown look like a known. Aggregates are withheld below the sparse-range thresholds in
        `honesty/thresholds.ts` while counts stay true at any n. The `self-graded` fate must
        never render in the green used for `resolved-by-human`, because green would present the
        lane agreeing with itself as an independent result. Refused outright, so flag them if
        they reappear: a savings tile, a quality score, a resolution rate, findings-per-review,
        and any self-confirmation rate.
    - path: "tests/**"
      instructions: >-
        Workflow tests here extract the real shell out of the YAML and run it. A test that
        reimplements the logic it is checking proves nothing about the workflow, so flag any
        new test that pastes a copy of the script instead of extracting it. There is no
        shellcheck on the maintainer's machine, so a local actionlint run skips those rules and
        CI is the only proof the workflow shell is clean.
    - path: "actions/**"
      instructions: >-
        Composite actions run in the caller's job context, which keeps check run names
        exact. That is why pr-title is an action and not a reusable workflow: `workflow_call`
        renames check runs to "caller-job / callee-job" and breaks required status check
        names pinned in rulesets. Flag any change that would alter a check run name.
    - path: "README.md"
      instructions: >-
        This README is the only prose record of workflow behaviour that consumers rely on;
        the prose copy in docs/review-lane.md was deleted because it drifted. If the PR
        changes a workflow input, default, trigger, marker format, label name, job topology,
        concurrency group or scheduling behaviour, the README must be updated in the same PR.
        Name the specific stale passage. Flag any stub YAML in the README that no longer
        matches the stubs the consumer repositories actually run.
chat:
  allow_non_org_members: false
